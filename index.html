<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>搶救國文大作戰</title>
<meta name="description" content="高中國文字形、字音、字根、一詞多義、成語古今義複習 App">
<meta name="theme-color" content="#F59E0B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="搶救國文">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; font-size: 14px; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：單欄手機 App，上方標題列、下方分頁列；卡片只用在可操作的物件上 */
:root {
  --amber: #F59E0B;      /* 主色 琥珀橘 */
  --peach: #FDBA74;      /* 輔色 淺橘 */
  --cream: #FFF7ED;      /* 背景 奶油白 */
  --ember: #EA580C;      /* 強調 易錯字 */
  --ink: #7C2D12;        /* 文字 深棕 */
  --surface: #FFFFFF;
  --surface-2: #FFEFD9;
  --line: #F5D9B8;
  --muted: #9A5A3A;
  --on-amber: #4A1A06;
  --ok: #2F7D4A; --ok-bg: #E7F3EA;
  --ng: #B42318; --ng-bg: #FCE9E6;
  --flag: #8A5A00; --flag-bg: #FFF1C2;
  --rev: #2563A8; --rev-bg: #E6EEF8;
  --shadow: 0 1px 2px rgba(124,45,18,.08), 0 6px 18px rgba(124,45,18,.07);
  --kai: "LXGW WenKai TC", "BiauKai", "DFKai-SB", "Kaiti TC", serif;
  --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --scale: 1;
  --r: 16px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --amber: #F59E0B; --peach: #9A4A16; --cream: #1C120C; --ember: #FB923C; --ink: #F6E3CF;
  --surface: #2A1B12; --surface-2: #362417; --line: #4A3222; --muted: #C9A487; --on-amber: #2A1206;
  --ok: #7BC891; --ok-bg: #1E3125; --ng: #F2877A; --ng-bg: #3A1D18; --flag: #F3C969; --flag-bg: #3A2C10; --rev: #8DB8F0; --rev-bg: #1C2A3D;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --amber: #F59E0B; --peach: #9A4A16; --cream: #1C120C; --ember: #FB923C; --ink: #F6E3CF;
  --surface: #2A1B12; --surface-2: #362417; --line: #4A3222; --muted: #C9A487; --on-amber: #2A1206;
  --ok: #7BC891; --ok-bg: #1E3125; --ng: #F2877A; --ng-bg: #3A1D18; --flag: #F3C969; --flag-bg: #3A2C10; --rev: #8DB8F0; --rev-bg: #1C2A3D;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3); color-scheme: dark; }

html { font-size: calc(16px * var(--scale)); }
body { background: var(--cream); color: var(--ink); font-family: var(--sans); font-size: 1rem; line-height: 1.6; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--cream); }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; opacity: .5; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
.kai { font-family: var(--kai); }
.zy { font-family: var(--sans); letter-spacing: .04em; }
.muted { color: var(--muted); }
.hl { color: var(--ember); font-weight: 700; }

.shell { max-width: 480px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(84px + env(safe-area-inset-bottom, 0px)); }
#topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 10px; min-height: 56px; background: var(--cream); border-bottom: 1px solid var(--line); margin-bottom: 14px; }
#topbar h1 { font-size: 1.3rem; margin: 0; font-weight: 700; letter-spacing: .04em; }
.iconbtn { width: 44px; height: 44px; margin-left: -10px; border: 0; background: none; font-size: 2rem; line-height: 1; border-radius: 12px; }
.brand-dot { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; background: var(--amber); color: var(--on-amber); font-family: var(--kai); font-weight: 700; font-size: 1.1rem; }

/* 首頁 */
.hero { background: var(--surface-2); border-radius: 22px; padding: 20px 18px; display: grid; gap: 14px; margin-bottom: 18px; }
.eyebrow { margin: 0; font-size: .78rem; letter-spacing: .12em; color: var(--muted); }
.hero-title { margin: 0; font-size: 1.7rem; line-height: 1.3; letter-spacing: .04em; text-wrap: balance; }
.hero-date { margin: -6px 0 0; font-weight: 700; color: var(--ember); }
.countdown { display: flex; align-items: stretch; gap: 8px; }
.cd-label { writing-mode: vertical-rl; font-size: .8rem; font-weight: 700; color: var(--muted); letter-spacing: .2em; align-self: center; }
.cd-box { flex: 1; display: grid; justify-items: center; padding: 8px 4px 6px; border-radius: 12px; background: var(--ink); color: var(--cream); }
.cd-num { font-size: 1.75rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; color: var(--amber); }
.cd-u { font-size: .78rem; }
.cd-done { margin: 0; font-size: 1.3rem; color: var(--ember); }
.units { display: grid; gap: 6px; padding-top: 4px; border-top: 1px dashed var(--line); }
.units-sum { margin: 0; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px; font-size: .8rem; color: var(--muted); }
.units-sum b { font-weight: 700; }
.c-ok { color: var(--ok); } .c-weak { color: var(--ng); }
.unit-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.uchip { min-width: 40px; min-height: 34px; padding: 0 10px; border-radius: 10px; font-size: .88rem; border: 1.5px solid var(--line); background: var(--surface); }
.uchip.st-ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); font-weight: 700; }
.uchip.st-weak { background: var(--ng-bg); border-color: var(--ng); color: var(--ng); font-weight: 700; }
.uchip.st-none { border-style: dashed; color: var(--muted); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; background: transparent; border: 1.5px solid currentColor; opacity: .5; }
.dot.st-ok { background: var(--ok); border-color: var(--ok); opacity: 1; }
.dot.st-weak { background: var(--ng); border-color: var(--ng); opacity: 1; }
.chip.on .dot.st-none { border-color: var(--cream); }
.gmark { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; background: var(--surface-2); border-radius: 14px; padding: 10px 12px; margin: 4px 0 6px; }
.gmark p { margin: 0; font-size: .92rem; }
.gmark .kai { font-size: 1.15rem; color: var(--ember); }
.gmark p { flex-basis: 100%; }
.gbtns { flex: 1; display: grid; grid-template-columns: 1fr 1.35fr 1fr; gap: 8px; }
.gbtns .btn { min-height: 44px; padding: 0 6px; font-size: .9rem; }
.mark-rev.on { background: var(--rev-bg); border-color: var(--rev); color: var(--rev); font-weight: 700; }
.c-rev { color: var(--rev); }
.uchip.st-rev { background: var(--rev-bg); border-color: var(--rev); color: var(--rev); font-weight: 700; }
.dot.st-rev { background: var(--rev); border-color: var(--rev); opacity: 1; }
.overview { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px 16px; display: grid; gap: 10px; margin-bottom: 14px; }
.ov-head { display: flex; justify-content: space-between; align-items: baseline; }
.ov-head h2 { margin: 0; font-size: 1rem; }
.ov-head { flex-wrap: wrap; gap: 4px; }
.ov-head p { margin: 0; font-size: .85rem; color: var(--muted); text-align: right; }
.ov-note { display: block; font-size: .72rem; }
.ov-head b { font-size: 1.3rem; color: var(--ok); font-variant-numeric: tabular-nums; }
.stack { display: flex; height: 14px; border-radius: 99px; overflow: hidden; background: var(--surface-2); gap: 2px; }
.stack i { display: block; min-width: 4px; }
.stack .st-ok { background: var(--ok); } .stack .st-rev { background: var(--rev); } .stack .st-weak { background: var(--ng); } .stack .st-none { background: var(--surface-2); }
.ov-legend { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; font-size: .82rem; color: var(--muted); }
.ov-legend b { color: var(--ink); font-variant-numeric: tabular-nums; margin-left: 2px; }
.ov-legend .dot.st-none { opacity: 1; border-color: var(--line); }
.ov-q { margin: 0; font-size: .8rem; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px; }
.ov-q b { color: var(--ink); }
.hero .stack, .hero .stack .st-none { background: var(--surface); }
.hero .overview { background: none; box-shadow: none; border-radius: 0; padding: 12px 0 0; margin: 0; border-top: 1.5px dashed var(--peach); }
.hero-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.hero-stats > * { display: grid; justify-items: start; padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); text-align: left; font-size: .8rem; color: var(--muted); }
.num { font-size: 1.4rem; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat-btn .num { color: var(--ember); }
.mods { display: grid; gap: 12px; }
.mod { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; display: grid; gap: 10px; }
.mod-head { display: flex; gap: 12px; align-items: center; }
.mod-head h2 { margin: 0; font-size: 1.25rem; }
.mod-head p { margin: 0; font-size: .82rem; color: var(--muted); }
.mod-no { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--peach); color: var(--on-amber); font-weight: 700; font-variant-numeric: tabular-nums; }
:root[data-theme="dark"] .mod-no { color: var(--ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .mod-no { color: var(--ink); } }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--amber), var(--ember)); border-radius: inherit; transition: width .3s; }
.bar.slim { height: 6px; flex: 1; }
.mod-count { margin: 0; display: flex; justify-content: space-between; font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.mod-actions { display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 8px; }
.pending-link { width: 100%; margin-top: 16px; padding: 12px 14px; border: 1px dashed var(--flag); background: var(--flag-bg); color: var(--flag); border-radius: 12px; text-align: left; font-size: .9rem; }
.foot { font-size: .78rem; margin: 16px 2px; }

/* 按鈕與選項 */
.btn { min-height: 46px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; }
.btn.primary { background: var(--amber); border-color: var(--amber); color: var(--on-amber); font-weight: 700; }
.btn.ghost { background: transparent; }
.btn.danger { background: var(--ng); border-color: var(--ng); color: #fff; }
.btn.wide { width: 100%; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.row-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.chip { flex: none; min-height: 40px; min-width: 44px; padding: 0 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-size: .95rem; }
.chip.on { background: var(--ink); color: var(--cream); border-color: var(--ink); }
.switch { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: .95rem; }
.switch input { width: 22px; height: 22px; accent-color: var(--ember); }
.linkbtn { border: 0; background: none; color: var(--ember); text-decoration: underline; min-height: 36px; }

/* 瀏覽卡片 */
.filters { display: grid; gap: 4px; margin-bottom: 6px; position: sticky; top: calc(56px + env(safe-area-inset-top, 0px)); background: var(--cream); z-index: 4; padding-bottom: 6px; }
.sub { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; margin: 18px 2px 8px; font-size: .95rem; font-weight: 700; }
.sub .muted { font-weight: 400; font-size: .85rem; }
.rootc { font-size: 1.5rem; color: var(--ember); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 8px; }
.card.flagged { border-color: var(--flag); border-style: dashed; }
.card summary { list-style: none; display: flex; align-items: center; gap: 8px; padding: 12px 14px; cursor: pointer; min-height: 52px; }
.card summary::-webkit-details-marker { display: none; }
.card summary > div:first-child { flex: 1; min-width: 0; }
.chev { color: var(--muted); transition: transform .2s; }
.card[open] .chev { transform: rotate(180deg); }
.card-body { padding: 0 14px 12px; border-top: 1px dashed var(--line); padding-top: 10px; font-size: .95rem; }
.card-body p { margin: .3em 0; }
.pair-head { font-size: 1.25rem; line-height: 1.5; }
.sep { color: var(--muted); margin: 0 .3em; }
.pair-row { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; padding: 2px 0; }
.pw { font-size: 1.15rem; }
.pm { color: var(--muted); font-size: .92rem; }
.big { font-size: 1.25rem; }
.row3 { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.zyc { min-width: 5.2em; font-size: .95rem; color: var(--muted); }
.num-s { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.sense { display: inline-block; font-size: .78rem; font-weight: 700; color: var(--on-amber); background: var(--peach); padding: 1px 8px; border-radius: 6px; margin-bottom: 4px; }
:root[data-theme="dark"] .sense { color: var(--ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .sense { color: var(--ink); } }
.sent { margin: 0; font-size: 1.1rem; line-height: 1.7; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; flex: none; max-width: 40%; }
.tag { font-size: .7rem; font-weight: 700; padding: 1px 7px; border-radius: 6px; white-space: nowrap; letter-spacing: .03em; }
.tag-x { background: var(--amber); color: var(--on-amber); }
.tag-z { background: var(--ink); color: var(--cream); }
.tag-flag { background: var(--flag-bg); color: var(--flag); border: 1px solid var(--flag); }
.note { color: var(--muted); font-size: .88rem; }
.flagnote { background: var(--flag-bg); color: var(--flag); border-radius: 8px; padding: 6px 10px; font-size: .88rem; }
.mean { display: grid; grid-template-columns: 5.5em 1fr; gap: 8px; padding: 4px 0; }
.mean-l { font-size: .78rem; font-weight: 700; color: var(--ember); padding-top: .2em; }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; }
.wrap-card .card { margin-bottom: 0; border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.streak { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--surface-2); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 14px 14px; padding: 2px 14px; font-size: .8rem; color: var(--muted); margin-bottom: 8px; }

/* 測驗 */
.qtop { display: flex; align-items: center; gap: 10px; font-size: .85rem; color: var(--muted); margin-bottom: 12px; }
.tabnum { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--ink); }
.modlabel { font-size: .78rem; }
.qcard { position: relative; background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 20px 18px 16px; display: grid; gap: 10px; justify-items: center; text-align: center; }
.qcard .tags { position: absolute; top: 12px; right: 12px; }
.ask { margin: 0; font-size: .88rem; color: var(--muted); }
.q-word { font-size: 2.3rem; line-height: 1.3; letter-spacing: .08em; }
.q-sent { font-size: 1.3rem; line-height: 1.7; text-align: left; }
.q-src { font-size: .82rem; color: var(--muted); margin: 0; }
.q-hint { font-size: .9rem; color: var(--muted); }
.q-zy { font-size: 1.15rem; font-weight: 700; color: var(--ember); background: var(--surface-2); padding: 2px 14px; border-radius: 99px; }
.big-zy { font-size: 1.8rem; }
.blank { color: var(--ember); }
ruby { ruby-position: under; -webkit-ruby-position: after; }
rt { font-family: var(--sans); font-size: .5em; font-weight: 400; color: var(--muted); letter-spacing: 0; }
.hl + rt, b.hl ~ rt { color: var(--ember); }
.opts { display: grid; gap: 10px; margin-top: 14px; }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 10px 14px; text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; }
.okey { flex: none; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-size: .8rem; font-weight: 700; background: var(--surface-2); color: var(--muted); font-family: var(--sans); }
.otext { flex: 1; min-width: 0; }
.opt-char .otext { font-size: 1.7rem; line-height: 1.2; }
.opt-zy .otext { font-size: 1.2rem; }
.opt-text .otext { font-size: .95rem; line-height: 1.5; }
.opts:has(.opt-char) { grid-template-columns: 1fr 1fr; }
.opts:has(.opt-zy) { grid-template-columns: 1fr 1fr; }
.opt.right { border-color: var(--ok); background: var(--ok-bg); }
.opt.right .okey { background: var(--ok); color: var(--surface); }
.opt.wrong { border-color: var(--ng); background: var(--ng-bg); }
.opt.wrong .okey { background: var(--ng); color: var(--surface); }
.opt.dim { opacity: .55; }
.opt:disabled { opacity: 1; cursor: default; }
.opt.dim:disabled { opacity: .55; }
.explain { margin-top: 14px; border-radius: 14px; padding: 12px 14px; background: var(--surface); border-left: 4px solid var(--ok); font-size: .95rem; }
.explain.ng { border-left-color: var(--ng); }
.explain p { margin: .3em 0; }
.verdict { font-weight: 700; }
.explain.ok .verdict { color: var(--ok); }
.explain.ng .verdict { color: var(--ng); }
.ex-word { font-size: 1.3rem; }
.explain + .btn { margin-top: 14px; }
.score { text-align: center; padding: 20px; background: var(--surface-2); border-radius: 22px; }
.score-num { font-size: 4rem; line-height: 1.1; margin: 4px 0; color: var(--ember); font-variant-numeric: tabular-nums; }
.score-num small { font-size: 1.2rem; margin-left: 4px; color: var(--ink); }

/* 單字卡 */
.flashcard { position: relative; width: 100%; min-height: 300px; border: 0; border-radius: 22px; background: var(--surface); box-shadow: var(--shadow); padding: 28px 18px 40px; display: grid; place-items: center; text-align: center; }
.flashcard.flipped { background: var(--surface-2); }
.flashcard .tags { position: absolute; top: 12px; right: 12px; }
.fc-face { display: grid; gap: 10px; justify-items: center; }
.fc-word { font-size: 2rem; line-height: 1.35; letter-spacing: .06em; }
.fc-sent { font-size: 1.25rem; line-height: 1.7; text-align: left; }
.fc-ans { font-size: 1.5rem; font-weight: 700; color: var(--ember); }
.fc-hint { font-size: .9rem; color: var(--muted); }
.fc-means { text-align: left; width: 100%; }
.fc-tip { position: absolute; bottom: 12px; left: 0; right: 0; font-size: .75rem; color: var(--muted); }
.mark-weak.on { background: var(--ng-bg); border-color: var(--ng); color: var(--ng); font-weight: 700; }
.mark-known.on { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); font-weight: 700; }
.row-btns.nav { margin-top: 8px; }

/* 設定、搜尋、說明 */
.setup { display: grid; gap: 16px; }
fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 8px; }
legend { font-weight: 700; margin-bottom: 8px; padding: 0; }
.pool { margin: 0; font-size: .9rem; color: var(--muted); }
.pool b { color: var(--ink); font-size: 1.05rem; }
.preview { font-size: 1.4rem; margin: 4px 0 0; }
.kv { display: flex; justify-content: space-between; margin: 0; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: .92rem; }
.warn { color: var(--ng); font-weight: 700; margin: 0; }
.intro { background: var(--surface-2); border-radius: 14px; padding: 10px 14px; margin-bottom: 12px; font-size: .92rem; }
.intro p { margin: 0; }
.searchbox input { width: 100%; min-height: 50px; padding: 0 16px; font: inherit; font-size: 1.1rem; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; }
.searchbox input:focus { border-color: var(--amber); outline: none; }
#sr { margin-top: 12px; }

/* 分頁列 */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabbar nav { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { border: 0; background: none; min-height: 60px; display: grid; justify-items: center; align-content: center; gap: 2px; font-size: .72rem; color: var(--muted); }
.tab svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab.on { color: var(--ember); font-weight: 700; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
